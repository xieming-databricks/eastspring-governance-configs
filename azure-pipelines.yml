# eastspring-governance-configs — config pipeline (reconcile) for one deployment.
# A deployment is <domain>-<envName> (e.g. esg-dev): excels/<deployment>/ (the workbook),
# config/<deployment>/ (generated from it), reference/<deployment>.yaml and sql/<deployment>/.
# Downloads the eastspring-uc-governance wheel built by pipeline 8050, checks that the committed
# config matches its workbook, validates it against the reference + SQL, and — only if that all
# passed — deploys config + reference to a new, versioned folder in the Databricks workspace and
# runs a reconcile PLAN (dry run, changes nothing) against it. Runs for pushes to main and for pull
# requests (build validation), so the delta can be reviewed before merging.
# Step 7 has two branches: 7a runs for pull requests (always a plan), 7b for main, in the mode
# chosen by the `mode` run parameter (Run pipeline -> mode: plan | apply). Triggered runs use its
# default, plan. A manual run on any other branch runs neither.

parameters:
  - name: mode
    displayName: 'Reconcile mode on main (plan = dry run, changes nothing)'
    type: string
    default: plan                     # also what triggered runs (PR / merge) get
    values:
      - plan
      - apply

trigger:                              # pushes (merges) to main
  - main

pr:                                   # pull requests INTO main only (GitHub repo: YAML pr triggers apply)
  branches:
    include:
      - main

variables:
  - group: DEV-HERA-REPLATFORM        # adb (workspace URL), accessToken (secret)
  - name: cliVersion
    value: 1.19.0
  - name: configRoot                  # each deploy goes to <configRoot>/<deployment>/<yyyyMMdd>-[pr<id>-]<build id>-<short sha>
    value: /Workspace/Users/xieming.li@eastspring.com/configs
  - name: wheelPipelineId             # the build pipeline that publishes artifact "wheels"
    value: 8050
  - name: wheelProject
    value: eisgheradp
  - name: minWheelVersion             # this repo needs at least this eastspring-uc-governance (e.g. --sql, --verify)
    value: 0.3.0
  - name: domain                      # e.g. esg
    value: esg
  - name: envName                     # dev | sit | uat | prod — this pipeline's workspace (variable group above)
    value: dev
  - name: deployment                  # excels/, config/, reference/ and sql/ are all per deployment
    value: $(domain)-$(envName)
  - name: reconcileJob                # created / updated by the wheel pipeline (jobs/ucgov_reconcile.json)
    value: ucgov-reconcile

pool:
  name: sgesss-nprd-dev

# Safety net on top of `pr:` above: a PR build into any branch other than main is skipped.
# (System.PullRequest.TargetBranch is "main" for GitHub, "refs/heads/main" for Azure Repos.)
jobs:
- job: config_update
  displayName: 'Validate, Deploy Config, Reconcile Plan'
  condition: or(ne(variables['Build.Reason'], 'PullRequest'), in(variables['System.PullRequest.TargetBranch'], 'main', 'refs/heads/main'))
  steps:
  - task: DownloadPipelineArtifact@2
    displayName: '1. Download Wheel (pipeline $(wheelPipelineId), latest main)'
    inputs:
      source: specific
      project: $(wheelProject)
      pipeline: $(wheelPipelineId)
      runVersion: latestFromBranch       # newest successful run of...
      runBranch: refs/heads/main         # ...this branch
      artifact: wheels
      # Agent.TempDirectory is emptied after every job: a wheel from an earlier run can never be
      # picked up instead (Pipeline.Workspace is reused across runs on the same agent)
      path: $(Agent.TempDirectory)\wheels

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      $all = @(Get-ChildItem "$(Agent.TempDirectory)\wheels\*.whl")
      if ($all.Count -ne 1) { Fail "expected exactly 1 .whl in $(Agent.TempDirectory)\wheels, found $($all.Count): $($all.Name -join ', ')" }
      $whl = $all[0]
      Log "Downloaded wheel"
      Write-Host "wheel          : $($whl.Name) ($([math]::Round($whl.Length / 1KB)) KB)"

      Log "Fresh venv + install wheel"
      Remove-Item -Recurse -Force ucgov_venv -ErrorAction SilentlyContinue
      python -m venv ucgov_venv
      .\ucgov_venv\Scripts\Activate.ps1
      Write-Host "python         : $(python --version)"
      Write-Host "##[group]pip install output"
      python -m pip install $whl.FullName
      $rc = $LASTEXITCODE
      Write-Host "##[endgroup]"
      if ($rc -ne 0) { Fail "pip install failed (exit $rc)" }
      $installed = ((python -m pip show eastspring-uc-governance | Select-String '^Version').ToString() -replace '^Version:\s*', '').Trim()
      Write-Host "installed      : $installed (this repo needs >= $(minWheelVersion))"
      # step 1 takes the newest SUCCESSFUL main run of pipeline $(wheelPipelineId): a failed build
      # publishes no wheel, so an older one is picked up — stop here, not in a later step
      if ([version]$installed -lt [version]"$(minWheelVersion)") {
        Fail "wheel $installed is older than $(minWheelVersion) — the newest successful main run of pipeline $(wheelPipelineId) still has the old version; fix / rerun that build first"
      }
      # later steps run in new processes: put the venv's scripts (ucgov-*) on their PATH
      Write-Host "##vso[task.prependpath]$(System.DefaultWorkingDirectory)\ucgov_venv\Scripts"
    displayName: '2. Install Wheel'

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      # the deployment's one workbook (Office lock files ~$*.xlsx don't count)
      $wb = @(Get-ChildItem "excels\$(deployment)\*.xlsx" | Where-Object { $_.Name -notlike '~$*' })
      if ($wb.Count -ne 1) { Fail "expected 1 workbook in excels\$(deployment), found $($wb.Count)" }
      Log "config\$(deployment) is what $($wb[0].Name) generates"
      # --verify writes nothing: it fails if the committed config differs from what the workbook
      # generates (line endings don't count), and names the files that differ
      ucgov-generate $wb[0].FullName "config\$(deployment)" --verify
      if ($LASTEXITCODE -ne 0) { Fail "config\$(deployment) is out of date with the workbook — run ucgov-generate locally and commit the result" }
    displayName: '3. Check Config Is Up To Date'

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      Log "Validate config\$(deployment) against reference\$(deployment).yaml + sql\$(deployment)"
      ucgov-validate "config\$(deployment)" --reference "reference\$(deployment).yaml" --sql "sql\$(deployment)" --verbose
      if ($LASTEXITCODE -ne 0) { Fail "validation failed (exit $LASTEXITCODE) — see the issues above" }
      Log "Config valid"
    displayName: '4. Validate Config'

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      $dir = "$(Agent.ToolsDirectory)\databricks-cli\$(cliVersion)"
      Log "Databricks CLI $(cliVersion) -> $dir"
      if (Test-Path "$dir\databricks.exe") {
        Write-Host "already cached on this agent — skipping download"
      } else {
        $url = "https://github.com/databricks/cli/releases/download/v$(cliVersion)/databricks_cli_$(cliVersion)_windows_amd64.zip"
        $zip = "$(Agent.TempDirectory)\databricks.zip"
        Write-Host "downloading    : $url"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive $zip -DestinationPath $dir -Force
      }
      if (-not (Test-Path "$dir\databricks.exe")) { Fail "databricks.exe not found in $dir" }
      Write-Host "##vso[task.prependpath]$dir"
      Write-Host "version        : $(& "$dir\databricks.exe" version)"
    displayName: '5. Install Databricks CLI $(cliVersion)'

  # Read-only: are the groups, schemas + governed tags the reference lists provisioned yet? They
  # are created by azure-pipelines-platform.yml; if one is missing, a reconcile apply would fail on
  # it. A warning when 7b only plans; an error when this run will apply (mode=apply on main).
  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }
      function Warn($m) { Write-Host "##vso[task.logissue type=warning]$m"; Write-Host "##vso[task.complete result=SucceededWithIssues;]" }
      $applying = "${{ parameters.mode }}" -eq "apply" -and $env:BUILD_REASON -ne "PullRequest" -and "$(Build.SourceBranch)" -eq "refs/heads/main"
      Write-Host "reconcile      : $(if ($applying) { 'APPLY — a missing group / schema / governed tag is an error' } else { 'plan — a missing group / schema / governed tag is a warning' })"

      $missing = @()
      foreach ($kind in "groups", "schemas", "tags") {
        Log "Provisioned $kind (plan, read-only)"
        $out = ucgov-provision $kind --reference "reference\$(deployment).yaml" | Out-String
        $rc  = $LASTEXITCODE
        Write-Host $out.TrimEnd()
        if ($rc -ne 0) {
          if ($applying) { Fail "ucgov-provision $kind could not check (exit $rc) — see above" }
          Warn "ucgov-provision $kind could not check (exit $rc) — see above"; continue
        }
        if ($out -match '\bPLANNED\b') { $missing += $kind }
      }
      if ($missing) {
        $msg = "not yet provisioned: $($missing -join ', ') — run the platform pipeline (azure-pipelines-platform.yml) first"
        if ($applying) { Fail $msg }
        Warn $msg
      }
      else { Log "All groups, schemas + governed tags exist" }
      exit 0                            # only Fail above fails the step
    displayName: '5b. Check Groups, Schemas + Governed Tags Are Provisioned'
    env:
      DATABRICKS_HOST: $(adb)
      DATABRICKS_TOKEN: $(accessToken)

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      # versioned target: <configRoot>/<deployment>/<yyyyMMdd>-[pr<id>-]<build id>-<short sha>
      #   main: .../configs/esg-dev/20261015-48213-a1b2c3d/config/esg-dev/*.yaml
      #                                                    /reference/esg-dev.yaml
      #   PR  : .../configs/esg-dev/20261015-pr12-48214-e4f5a6b/...
      # (inside a deploy folder the layout mirrors the repo: config/<deployment>/ + reference/<deployment>.yaml)
      # The name starts with the deploy date (UTC), so old deploys can be found and removed by name,
      # and folders sort oldest -> newest. PR deploys carry "pr<id>" so they can be told apart.
      $isPr   = $env:BUILD_REASON -eq "PullRequest"
      # PR builds check out a merge commit; the PR's own head commit is the one worth recording
      $commit = if ($isPr -and $env:SYSTEM_PULLREQUEST_SOURCECOMMITID) { $env:SYSTEM_PULLREQUEST_SOURCECOMMITID } else { "$(Build.SourceVersion)" }
      $date   = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
      # PR number: GitHub sets PULLREQUESTNUMBER (its PULLREQUESTID is internal); Azure Repos only the id
      $prNum  = if ($env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER) { $env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER } else { $env:SYSTEM_PULLREQUEST_PULLREQUESTID }
      $pr     = if ($isPr) { "pr$prNum-" } else { "" }
      $target = "$(configRoot)/$(deployment)/$date-$pr$(Build.BuildId)-$($commit.Substring(0, 7))"
      Log "Deploy config"
      Write-Host "workspace      : $env:DATABRICKS_HOST"
      Write-Host "build reason   : $env:BUILD_REASON$(if ($isPr) { " (PR $prNum)" })"
      Write-Host "commit         : $commit"
      Write-Host "target         : $target"

      databricks workspace mkdirs "$target/config/$(deployment)"
      if ($LASTEXITCODE -ne 0) { Fail "could not create $target (exit $LASTEXITCODE)" }
      databricks workspace import-dir "config\$(deployment)" "$target/config/$(deployment)" --overwrite
      if ($LASTEXITCODE -ne 0) { Fail "config upload failed (exit $LASTEXITCODE)" }

      databricks workspace mkdirs "$target/reference"
      databricks workspace import "$target/reference/$(deployment).yaml" --file "reference\$(deployment).yaml" --format AUTO --overwrite
      if ($LASTEXITCODE -ne 0) { Fail "reference upload failed (exit $LASTEXITCODE)" }

      Write-Host "##[group]deployed files"
      databricks workspace list "$target/config/$(deployment)"
      databricks workspace list "$target/reference"
      Write-Host "##[endgroup]"

      # for later steps (e.g. a reconcile plan): the paths the notebook's widgets need
      Write-Host "##vso[task.setvariable variable=configPath]$target/config/$(deployment)"
      Write-Host "##vso[task.setvariable variable=referencePath]$target/reference/$(deployment).yaml"
      Write-Host "config_path    : $target/config/$(deployment)"
      Write-Host "reference_path : $target/reference/$(deployment).yaml"
      Log "Config deployed"
    displayName: '6. Deploy Config to Workspace'
    env:
      DATABRICKS_HOST: $(adb)
      DATABRICKS_TOKEN: $(accessToken)

  # 7. Reconcile — pull requests always plan; runs on main use the mode parameter.
  - template: templates/run-job.yml
    parameters:
      displayName: '7a. Reconcile Plan (pull request)'
      condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'), in(variables['System.PullRequest.TargetBranch'], 'main', 'refs/heads/main'))
      job: $(reconcileJob)
      label: reconcile
      mode: plan
      jobParameters:
        config_path: $(configPath)
        reference_path: $(referencePath)

  - template: templates/run-job.yml
    parameters:
      displayName: '7b. Reconcile ${{ parameters.mode }} (main)'
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      job: $(reconcileJob)
      label: reconcile
      mode: ${{ parameters.mode }}
      jobParameters:
        config_path: $(configPath)
        reference_path: $(referencePath)
