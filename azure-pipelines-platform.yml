# eastspring-governance-configs — platform pipeline: everything the reconcile needs to exist first,
# for one deployment <domain>-<envName> (e.g. esg-dev; see azure-pipelines.yml for the layout).
# Downloads the eastspring-uc-governance wheel built by pipeline 8050, validates config/<deployment>
# against reference/<deployment>.yaml + sql/<deployment>, then, in dependency order:
#   groups  (ucgov-provision groups)   — account groups from the reference (needs workspace admin)
#   schemas (ucgov-provision schemas)  — governance + serving schemas under target_catalog
#   tags    (ucgov-provision tags)     — governed tags + allowed values (the ABAC policies match on them)
#   functions (ucgov-apply-functions)  — mask UDFs + group_portfolio_access MV from sql/<deployment> (uses groups + schemas)
# Provisioning is additive only: nothing is ever deleted. Runs when reference/ or sql/ changes (PR
# into main + merge to main) and by hand; reconcile (azure-pipelines.yml) runs on every config change.
# Mode: the `mode` run parameter (Run pipeline -> mode: plan | apply). Triggered runs use its
# default, plan. Pull requests always plan, and apply only ever runs from main — anything else
# falls back to plan.

parameters:
  - name: mode
    displayName: 'Mode (plan = dry run, changes nothing)'
    type: string
    default: plan                     # also what triggered runs (PR / merge / wheel) get
    values:
      - plan
      - apply

trigger:                              # merges to main that change the reference or the SQL
  branches:
    include:
      - main
  paths:
    include:
      - reference                     # folder prefixes: every file below them
      - sql
      - azure-pipelines-platform.yml

pr:                                   # pull requests INTO main that change the reference or the SQL
  branches:
    include:
      - main
  paths:
    include:
      - reference                     # folder prefixes: every file below them
      - sql
      - azure-pipelines-platform.yml

# Also re-run when a new wheel is built (it renders + applies the SQL): fill in the NAME of
# pipeline 8050 as shown in Azure DevOps (a pipeline resource takes the name, not the id), then
# uncomment.
# resources:
#   pipelines:
#     - pipeline: wheel
#       project: eisgheradp
#       source: '<name of pipeline 8050>'
#       trigger:
#         branches:
#           include:
#             - main

variables:
  - group: DEV-HERA-REPLATFORM        # adb (workspace URL), accessToken (secret)
  - name: cliVersion
    value: 1.19.0
  - name: configRoot                  # reference + sql are deployed to <configRoot>/<deployment>/<yyyyMMdd>-[pr<id>-]<build id>-<short sha>
    value: /Workspace/Users/xieming.li@eastspring.com/configs
  - name: wheelPipelineId             # the build pipeline that publishes artifact "wheels"
    value: 8050
  - name: wheelProject
    value: eisgheradp
  - name: minWheelVersion             # this repo needs at least this eastspring-uc-governance (generate --reference)
    value: 0.4.0
  - name: domain                      # e.g. esg
    value: esg
  - name: envName                     # dev | sit | uat | prod — this pipeline's workspace (variable group above)
    value: dev
  - name: deployment                  # excels/, config/, reference/ and sql/ are all per deployment
    value: $(domain)-$(envName)
  - name: functionsJob                # created / updated by the wheel pipeline (jobs/ucgov_apply_functions.json)
    value: ucgov-apply-functions

pool:
  name: sgesss-nprd-dev

# Safety net on top of `pr:` above: a PR build into any branch other than main is skipped.
# (System.PullRequest.TargetBranch is "main" for GitHub, "refs/heads/main" for Azure Repos.)
jobs:
- job: platform
  displayName: 'Provision Groups + Schemas + Governed Tags, Apply Functions'
  condition: or(ne(variables['Build.Reason'], 'PullRequest'), in(variables['System.PullRequest.TargetBranch'], 'main', 'refs/heads/main'))
  steps:
  - task: DownloadPipelineArtifact@2
    displayName: '1. Download Wheel (pipeline $(wheelPipelineId), latest main)'
    inputs:
      source: specific
      project: $(wheelProject)
      pipeline: $(wheelPipelineId)
      runVersion: latestFromBranch       # newest successful run of...
      runBranch: refs/heads/main         # ...this branch
      artifact: wheels
      # Agent.TempDirectory is emptied after every job: a wheel from an earlier run can never be
      # picked up instead (Pipeline.Workspace is reused across runs on the same agent)
      path: $(Agent.TempDirectory)\wheels

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      $all = @(Get-ChildItem "$(Agent.TempDirectory)\wheels\*.whl")
      if ($all.Count -ne 1) { Fail "expected exactly 1 .whl in $(Agent.TempDirectory)\wheels, found $($all.Count): $($all.Name -join ', ')" }
      $whl = $all[0]
      Log "Downloaded wheel"
      Write-Host "wheel          : $($whl.Name) ($([math]::Round($whl.Length / 1KB)) KB)"

      Log "Fresh venv + install wheel"
      Remove-Item -Recurse -Force ucgov_venv -ErrorAction SilentlyContinue
      python -m venv ucgov_venv
      .\ucgov_venv\Scripts\Activate.ps1
      Write-Host "python         : $(python --version)"
      Write-Host "##[group]pip install output"
      python -m pip install $whl.FullName
      $rc = $LASTEXITCODE
      Write-Host "##[endgroup]"
      if ($rc -ne 0) { Fail "pip install failed (exit $rc)" }
      $installed = ((python -m pip show eastspring-uc-governance | Select-String '^Version').ToString() -replace '^Version:\s*', '').Trim()
      Write-Host "installed      : $installed (this repo needs >= $(minWheelVersion))"
      # step 1 takes the newest SUCCESSFUL main run of pipeline $(wheelPipelineId): a failed build
      # publishes no wheel, so an older one is picked up — stop here, not in a later step
      if ([version]$installed -lt [version]"$(minWheelVersion)") {
        Fail "wheel $installed is older than $(minWheelVersion) — the newest successful main run of pipeline $(wheelPipelineId) still has the old version; fix / rerun that build first"
      }
      # later steps run in new processes: put the venv's scripts (ucgov-*) on their PATH
      Write-Host "##vso[task.prependpath]$(System.DefaultWorkingDirectory)\ucgov_venv\Scripts"

      # one place that decides plan | apply for the provision steps: the run parameter, except
      # that pull requests and branches other than main always plan
      $mode = "${{ parameters.mode }}"
      if ($mode -eq "apply" -and ($env:BUILD_REASON -eq "PullRequest" -or "$(Build.SourceBranch)" -ne "refs/heads/main")) {
        Write-Host "##[warning]mode=apply is only allowed on main (this run: $env:BUILD_REASON, $(Build.SourceBranch)) — running plan instead"
        $mode = "plan"
      }
      Write-Host "##vso[task.setvariable variable=mode]$mode"
      Write-Host "build reason   : $env:BUILD_REASON ($(Build.SourceBranch))"
      Write-Host "requested mode : ${{ parameters.mode }}"
      Write-Host "mode           : $mode$(if ($mode -eq 'plan') { '   (dry run — changes nothing)' })"
    displayName: '2. Install Wheel'

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      # a reference or SQL change can break the config (e.g. a group the config grants to was
      # removed, or a mask function a Masking Rule names was deleted)
      Log "Validate config\$(deployment) against reference\$(deployment).yaml + sql\$(deployment)"
      ucgov-validate "config\$(deployment)" --reference "reference\$(deployment).yaml" --sql "sql\$(deployment)" --verbose
      if ($LASTEXITCODE -ne 0) { Fail "validation failed (exit $LASTEXITCODE) — see the issues above" }
      Log "Config + reference + SQL valid"
    displayName: '3. Validate Config, Reference + SQL'

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      $dir = "$(Agent.ToolsDirectory)\databricks-cli\$(cliVersion)"
      Log "Databricks CLI $(cliVersion) -> $dir"
      if (Test-Path "$dir\databricks.exe") {
        Write-Host "already cached on this agent — skipping download"
      } else {
        $url = "https://github.com/databricks/cli/releases/download/v$(cliVersion)/databricks_cli_$(cliVersion)_windows_amd64.zip"
        $zip = "$(Agent.TempDirectory)\databricks.zip"
        Write-Host "downloading    : $url"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive $zip -DestinationPath $dir -Force
      }
      if (-not (Test-Path "$dir\databricks.exe")) { Fail "databricks.exe not found in $dir" }
      Write-Host "##vso[task.prependpath]$dir"
      Write-Host "version        : $(& "$dir\databricks.exe" version)"
      $me = & "$dir\databricks.exe" current-user me -o json | ConvertFrom-Json
      if ($LASTEXITCODE -ne 0) { Fail "authentication failed — check adb / accessToken" }
      Write-Host "workspace      : $env:DATABRICKS_HOST"
      Write-Host "running as     : $($me.userName) (id $($me.id))"
    displayName: '4. Install Databricks CLI $(cliVersion)'
    env:
      DATABRICKS_HOST: $(adb)
      DATABRICKS_TOKEN: $(accessToken)

  # groups before schemas before functions: the functions' unmasked condition names the groups,
  # and they are created in the governance schema. Governed tags only have to exist before the
  # reconcile (SET TAGS + the ABAC policies), but are provisioned here with the rest.
  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      # build the arguments as a real array (an `if` returning @("--apply") unrolls to a string,
      # and splatting a string passes it one character at a time)
      $cmdArgs = @("groups", "--reference", "reference\$(deployment).yaml")
      if ("$(mode)" -eq "apply") { $cmdArgs += "--apply" }
      Log "Provision groups ($("$(mode)".ToUpper())) from reference\$(deployment).yaml"
      Write-Host "command        : ucgov-provision $($cmdArgs -join ' ')"
      ucgov-provision @cmdArgs
      if ($LASTEXITCODE -ne 0) { Fail "provision groups failed (exit $LASTEXITCODE) — see the output above" }
      Log "Groups $(if ("$(mode)" -eq 'apply') { 'provisioned' } else { 'planned' })"
    displayName: '5. Provision Groups'
    env:
      DATABRICKS_HOST: $(adb)
      DATABRICKS_TOKEN: $(accessToken)

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      # build the arguments as a real array (an `if` returning @("--apply") unrolls to a string,
      # and splatting a string passes it one character at a time)
      $cmdArgs = @("schemas", "--reference", "reference\$(deployment).yaml")
      if ("$(mode)" -eq "apply") { $cmdArgs += "--apply" }
      Log "Provision schemas ($("$(mode)".ToUpper())) from reference\$(deployment).yaml"
      Write-Host "command        : ucgov-provision $($cmdArgs -join ' ')"
      ucgov-provision @cmdArgs
      if ($LASTEXITCODE -ne 0) { Fail "provision schemas failed (exit $LASTEXITCODE) — see the output above" }
      Log "Schemas $(if ("$(mode)" -eq 'apply') { 'provisioned' } else { 'planned' })"
    displayName: '6. Provision Schemas'
    env:
      DATABRICKS_HOST: $(adb)
      DATABRICKS_TOKEN: $(accessToken)

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      # governed tags (tag policies) are account-wide: a value is only ever added, never removed
      $cmdArgs = @("tags", "--reference", "reference\$(deployment).yaml")
      if ("$(mode)" -eq "apply") { $cmdArgs += "--apply" }
      Log "Provision governed tags ($("$(mode)".ToUpper())) from reference\$(deployment).yaml"
      Write-Host "command        : ucgov-provision $($cmdArgs -join ' ')"
      ucgov-provision @cmdArgs
      if ($LASTEXITCODE -ne 0) { Fail "provision governed tags failed (exit $LASTEXITCODE) — see the output above" }
      Log "Governed tags $(if ("$(mode)" -eq 'apply') { 'provisioned' } else { 'planned' })"
    displayName: '7. Provision Governed Tags'
    env:
      DATABRICKS_HOST: $(adb)
      DATABRICKS_TOKEN: $(accessToken)

  - powershell: |
      function Log($m)  { Write-Host "##[section][$(Get-Date -Format 'HH:mm:ss')] $m" }
      function Fail($m) { Write-Host "##vso[task.logissue type=error]$m"; exit 1 }

      # same versioned folder scheme as azure-pipelines.yml, but the reference + SQL are deployed:
      #   .../configs/esg-dev/20261015-48230-a1b2c3d/reference/esg-dev.yaml
      #                                             /sql/esg-dev/*.sql
      $isPr   = $env:BUILD_REASON -eq "PullRequest"
      $commit = if ($isPr -and $env:SYSTEM_PULLREQUEST_SOURCECOMMITID) { $env:SYSTEM_PULLREQUEST_SOURCECOMMITID } else { "$(Build.SourceVersion)" }
      $date   = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
      $prNum  = if ($env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER) { $env:SYSTEM_PULLREQUEST_PULLREQUESTNUMBER } else { $env:SYSTEM_PULLREQUEST_PULLREQUESTID }
      $pr     = if ($isPr) { "pr$prNum-" } else { "" }
      $target = "$(configRoot)/$(deployment)/$date-$pr$(Build.BuildId)-$($commit.Substring(0, 7))"
      Log "Deploy reference + SQL"
      Write-Host "build reason   : $env:BUILD_REASON$(if ($isPr) { " (PR $prNum)" })"
      Write-Host "commit         : $commit"
      Write-Host "target         : $target"

      databricks workspace mkdirs "$target/reference"
      if ($LASTEXITCODE -ne 0) { Fail "could not create $target (exit $LASTEXITCODE)" }
      databricks workspace import "$target/reference/$(deployment).yaml" --file "reference\$(deployment).yaml" --format AUTO --overwrite
      if ($LASTEXITCODE -ne 0) { Fail "reference upload failed (exit $LASTEXITCODE)" }
      # --format RAW: keep the .sql files as plain workspace files (AUTO could turn them into notebooks)
      databricks workspace mkdirs "$target/sql/$(deployment)"
      foreach ($f in Get-ChildItem "sql\$(deployment)\*.sql") {
        databricks workspace import "$target/sql/$(deployment)/$($f.Name)" --file $f.FullName --format RAW --overwrite
        if ($LASTEXITCODE -ne 0) { Fail "SQL upload failed for $($f.Name) (exit $LASTEXITCODE)" }
      }
      Write-Host "##[group]deployed files"
      databricks workspace list "$target/reference"
      databricks workspace list "$target/sql/$(deployment)"
      Write-Host "##[endgroup]"

      Write-Host "##vso[task.setvariable variable=referencePath]$target/reference/$(deployment).yaml"
      Write-Host "##vso[task.setvariable variable=sqlPath]$target/sql/$(deployment)"
      Write-Host "reference_path : $target/reference/$(deployment).yaml"
      Write-Host "sql_path       : $target/sql/$(deployment)"
      Log "Reference + SQL deployed"
    displayName: '8. Deploy Reference + SQL to Workspace'
    env:
      DATABRICKS_HOST: $(adb)
      DATABRICKS_TOKEN: $(accessToken)

  # 9. Apply functions — pull requests always plan; runs on main use the mode parameter.
  - template: templates/run-job.yml
    parameters:
      displayName: '9a. Apply Functions Plan (pull request)'
      condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'), in(variables['System.PullRequest.TargetBranch'], 'main', 'refs/heads/main'))
      job: $(functionsJob)
      label: functions
      mode: plan
      jobParameters:
        reference_path: $(referencePath)
        sql_path: $(sqlPath)

  - template: templates/run-job.yml
    parameters:
      displayName: '9b. Apply Functions ${{ parameters.mode }} (main)'
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      job: $(functionsJob)
      label: functions
      mode: ${{ parameters.mode }}
      jobParameters:
        reference_path: $(referencePath)
        sql_path: $(sqlPath)
